name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OpenVisionLab.VisionSdk.sln

      - name: Build
        run: dotnet build OpenVisionLab.VisionSdk.sln -c Release --no-restore

      - name: Smoke 2D and 3D combined inspection
        run: dotnet run --project tests/OpenVisionLab.Inspection.Smoke/OpenVisionLab.Inspection.Smoke.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack OpenVisionLab.VisionSdk.sln -c Release --no-build -o artifacts/packages

      - name: Restore package-only consumer
        run: dotnet restore tests/OpenVisionLab.PackageConsumer.Smoke/OpenVisionLab.PackageConsumer.Smoke.csproj "-p:RestoreAdditionalProjectSources=$env:GITHUB_WORKSPACE\artifacts\packages"

      - name: Run package-only 2D and 3D consumer
        run: dotnet run --project tests/OpenVisionLab.PackageConsumer.Smoke/OpenVisionLab.PackageConsumer.Smoke.csproj -c Release --no-restore
