name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Lib.Common.sln

      - name: Build
        run: dotnet build Lib.Common.sln -c Debug --no-restore

      - name: Smoke pack
        run: dotnet pack Lib.Common.sln -c Debug --no-build
